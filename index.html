<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>슈의 수업시간에 맛동산 먹기</title>
<meta name="theme-color" content="#FFD84D">
<meta name="description" content="추억의 플래시게임, 슈의 수업시간에 맛동산 먹기 — 모바일 터치용 웹게임">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-dot">🍪</span> 슈의 맛동산</div>
    <div class="tools">
      <button id="btnMute" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
      <button id="btnPause" class="icon-btn" aria-label="일시정지">⏸</button>
    </div>
  </header>

  <div class="stage-wrap" id="stageWrap">
    <svg id="scene" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="교실">
      <defs>
        <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFE98A"/><stop offset="1" stop-color="#FFD24A"/>
        </linearGradient>
        <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#D89B5E"/><stop offset="1" stop-color="#A5683A"/>
        </linearGradient>
        <linearGradient id="gBoard" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#307767"/><stop offset="1" stop-color="#154B41"/>
        </linearGradient>
        <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#BC8043"/><stop offset="1" stop-color="#8A5626"/>
        </linearGradient>
        <linearGradient id="gCone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFF9C9" stop-opacity=".92"/>
          <stop offset=".55" stop-color="#FFE466" stop-opacity=".62"/>
          <stop offset="1" stop-color="#FFD21E" stop-opacity=".14"/>
        </linearGradient>
        <linearGradient id="gSkin" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFE9D4"/><stop offset="1" stop-color="#FBCCA9"/>
        </linearGradient>
        <linearGradient id="gSue" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FF9ED0"/><stop offset="1" stop-color="#FF7FBB"/>
        </linearGradient>
        <linearGradient id="gFriend" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FCA43A"/><stop offset="1" stop-color="#EF8A18"/>
        </linearGradient>
        <linearGradient id="gBag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F6C46A"/><stop offset="1" stop-color="#DC9C36"/>
        </linearGradient>
        <radialGradient id="gWin" cx=".5" cy=".25" r=".85">
          <stop offset="0" stop-color="#F2FBFF"/><stop offset="1" stop-color="#B9E4FA"/>
        </radialGradient>
        <radialGradient id="gFaceField" cx=".5" cy=".4" r=".7">
          <stop offset="0" stop-color="#FFF9E0"/><stop offset="1" stop-color="#FFE9A8"/>
        </radialGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8A5528" flood-opacity=".28"/>
        </filter>
        <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7A4A12" flood-opacity=".3"/>
        </filter>
        <clipPath id="faceClip"><circle cx="0" cy="0" r="76"/></clipPath>
        <clipPath id="boardClip"><rect x="96" y="90" width="528" height="214" rx="4"/></clipPath>
        <clipPath id="clockClip"><circle id="clockClipC" cx="720" cy="62" r="44"/></clipPath>
      </defs>

      <!-- ================= ROOM ================= -->
      <g id="room">
        <rect x="0" y="0" width="800" height="430" fill="url(#gWall)"/>
        <!-- faint wall stars -->
        <g fill="#FFC61A" opacity=".38">
          <path d="M120,240 l5,12 13,1 -10,8 3,13 -11,-7 -11,7 3,-13 -10,-8 13,-1z"/>
          <path d="M700,340 l4,10 11,1 -8,7 2,11 -9,-6 -9,6 2,-11 -8,-7 11,-1z"/>
          <path d="M60,60 l4,10 11,1 -8,7 2,11 -9,-6 -9,6 2,-11 -8,-7 11,-1z"/>
          <path d="M760,190 l4,10 11,1 -8,7 2,11 -9,-6 -9,6 2,-11 -8,-7 11,-1z"/>
        </g>
        <!-- floor -->
        <rect x="0" y="430" width="800" height="170" fill="url(#gFloor)"/>
        <g stroke="#8B5526" stroke-opacity=".38" stroke-width="2.5">
          <line x1="0" y1="462" x2="800" y2="460"/>
          <line x1="0" y1="500" x2="800" y2="498"/>
          <line x1="0" y1="545" x2="800" y2="543"/>
          <line x1="0" y1="592" x2="800" y2="590"/>
        </g>
        <g stroke="#8B5526" stroke-opacity=".22" stroke-width="2">
          <line x1="120" y1="462" x2="100" y2="500"/><line x1="330" y1="461" x2="336" y2="500"/>
          <line x1="540" y1="460" x2="552" y2="499"/><line x1="700" y1="460" x2="716" y2="498"/>
          <line x1="60" y1="500" x2="34" y2="545"/><line x1="420" y1="499" x2="430" y2="545"/>
          <line x1="640" y1="499" x2="664" y2="544"/>
        </g>
        <!-- mint baseboard -->
        <rect x="0" y="410" width="800" height="22" fill="#63CFAE"/>
        <rect x="0" y="410" width="800" height="7" fill="#96E8CC"/>
        <rect x="0" y="428" width="800" height="4" fill="#4AB391" opacity=".5"/>
      </g>

      <!-- ================= BLACKBOARD ================= -->
      <g id="board">
        <rect x="80" y="72" width="560" height="250" rx="10" fill="#8A5626" filter="url(#soft)"/>
        <rect x="80" y="72" width="560" height="12" rx="6" fill="#A06830"/>
        <rect x="96" y="90" width="528" height="214" rx="4" fill="url(#gBoard)"/>
        <g clip-path="url(#boardClip)">
          <ellipse cx="250" cy="180" rx="180" ry="90" fill="#3C8C78" opacity=".18"/>
        </g>
        <g font-family="'Nanum Pen Script','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#E8F3EC" opacity=".92">
          <text x="112" y="152" font-size="27" font-weight="700" letter-spacing=".5">학습목표:</text>
          <path d="M114,164 q58,7 112,2" stroke="#E8F3EC" stroke-opacity=".55" stroke-width="3" fill="none"/>
          <text x="462" y="250" font-size="23" font-weight="700">떠든사람:</text>
          <text x="506" y="292" font-size="27" font-weight="700">슈</text>
        </g>
        <!-- chalk smudges -->
        <ellipse cx="180" cy="270" rx="46" ry="12" fill="#E8F3EC" opacity=".07"/>
        <ellipse cx="330" cy="292" rx="60" ry="10" fill="#E8F3EC" opacity=".05"/>
        <!-- chalk tray -->
        <rect x="90" y="304" width="540" height="14" rx="6" fill="#A06830"/>
        <rect x="90" y="304" width="540" height="4" rx="2" fill="#BE8145"/>
      </g>

      <!-- ================= WALL DECOR ================= -->
      <!-- 태극기 -->
      <g id="flag" transform="translate(300,14)">
        <rect x="-6" y="-6" width="104" height="64" rx="4" fill="#FFFDF6" stroke="#E2C9A4" stroke-width="2" filter="url(#soft2)"/>
        <g transform="translate(0,0)">
          <rect x="0" y="0" width="92" height="52" fill="#FFFFFF"/>
          <circle cx="46" cy="26" r="14" fill="#0047A0"/>
          <path d="M46,12 A14,14 0 0 1 46,40 A7,7 0 0 0 46,26 A7,7 0 0 1 46,12 Z" fill="#CD2E3A"/>
          <g fill="#111">
            <g transform="translate(16,14) rotate(-56)"><rect x="-1" y="-7" width="14" height="2.6"/><rect x="-1" y="-2" width="14" height="2.6"/><rect x="-1" y="3" width="14" height="2.6"/></g>
            <g transform="translate(76,14) rotate(56)"><rect x="-13" y="-7" width="14" height="2.6"/><rect x="-13" y="-2" width="14" height="2.6"/><rect x="-13" y="3" width="14" height="2.6"/></g>
            <g transform="translate(16,38) rotate(56)"><rect x="-1" y="-2" width="14" height="2.6"/><rect x="-1" y="3" width="14" height="2.6"/><rect x="-1" y="-7" width="14" height="2.6"/></g>
            <g transform="translate(76,38) rotate(-56)"><rect x="-13" y="-2" width="14" height="2.6"/><rect x="-13" y="3" width="14" height="2.6"/><rect x="-13" y="-7" width="14" height="2.6"/></g>
          </g>
        </g>
      </g>

      <!-- 경고 카드 판 -->
      <g id="warnPanel" transform="translate(422,8)">
        <rect x="0" y="0" width="196" height="76" rx="14" fill="#FFC94D" stroke="#DFA020" stroke-width="4" filter="url(#soft2)"/>
        <text x="98" y="26" text-anchor="middle" font-size="17" font-weight="800" fill="#7A4A12" letter-spacing="-.5">경고가 3장이면 퇴장!</text>
        <g id="warnCards">
          <g class="wcard"><rect x="16" y="34" width="48" height="34" rx="7" fill="#FFF6E2" stroke="#DFA020" stroke-width="3"/><text x="40" y="58" text-anchor="middle" font-size="20" font-weight="900" fill="#E7A33C">!</text></g>
          <g class="wcard"><rect x="74" y="34" width="48" height="34" rx="7" fill="#FFF6E2" stroke="#DFA020" stroke-width="3"/><text x="98" y="58" text-anchor="middle" font-size="20" font-weight="900" fill="#E7A33C">!</text></g>
          <g class="wcard"><rect x="132" y="34" width="48" height="34" rx="7" fill="#FFF6E2" stroke="#DFA020" stroke-width="3"/><text x="156" y="58" text-anchor="middle" font-size="20" font-weight="900" fill="#E7A33C">!</text></g>
        </g>
      </g>

      <!-- 시계 -->
      <g id="clock" transform="translate(720,62)">
        <circle r="52" fill="#F3A63C" filter="url(#soft2)"/>
        <circle r="44" fill="#FFFDF2" stroke="#E3902F" stroke-width="2"/>
        <g id="clockTicks" stroke="#D9C7A0" stroke-width="2.5">
          <line x1="0" y1="-38" x2="0" y2="-32"/><line x1="0" y1="38" x2="0" y2="32"/>
          <line x1="-38" y1="0" x2="-32" y2="0"/><line x1="38" y1="0" x2="32" y2="0"/>
          <line x1="-19" y1="-33" x2="-16" y2="-28"/><line x1="19" y1="-33" x2="16" y2="-28"/>
          <line x1="-19" y1="33" x2="-16" y2="28"/><line x1="19" y1="33" x2="16" y2="28"/>
          <line x1="-33" y1="-19" x2="-28" y2="-16"/><line x1="33" y1="-19" x2="28" y2="-16"/>
          <line x1="-33" y1="19" x2="-28" y2="16"/><line x1="33" y1="19" x2="28" y2="16"/>
        </g>
        <text x="0" y="-22" text-anchor="middle" font-size="13" font-weight="800" fill="#B99367">12</text>
        <text x="26" y="6" text-anchor="middle" font-size="12" font-weight="800" fill="#B99367">3</text>
        <text x="0" y="34" text-anchor="middle" font-size="12" font-weight="800" fill="#B99367">6</text>
        <text x="-26" y="6" text-anchor="middle" font-size="12" font-weight="800" fill="#B99367">9</text>
        <g id="clockHourHand"><line x1="0" y1="4" x2="0" y2="-22" stroke="#5A4326" stroke-width="6" stroke-linecap="round"/></g>
        <g id="clockMinHand"><line x1="0" y1="6" x2="0" y2="-34" stroke="#3E2F1A" stroke-width="4.5" stroke-linecap="round"/></g>
        <circle r="5" fill="#3E2F1A"/>
        <circle r="2" fill="#FFFDF2"/>
      </g>

      <!-- 시간표 -->
      <g id="timetable" transform="translate(6,146)">
        <rect x="0" y="0" width="72" height="146" rx="6" fill="#72D2B2" stroke="#48AF8E" stroke-width="3" filter="url(#soft2)"/>
        <rect x="7" y="7" width="58" height="132" rx="3" fill="#FFFDF4"/>
        <text x="36" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#4A8A75">시간표</text>
        <g stroke="#B9DFD0" stroke-width="2">
          <line x1="12" y1="34" x2="60" y2="34"/><line x1="12" y1="52" x2="60" y2="52"/>
          <line x1="12" y1="70" x2="60" y2="70"/><line x1="12" y1="88" x2="60" y2="88"/>
          <line x1="12" y1="106" x2="60" y2="106"/><line x1="12" y1="124" x2="60" y2="124"/>
          <line x1="27" y1="30" x2="27" y2="134"/><line x1="45" y1="30" x2="45" y2="134"/>
        </g>
        <g fill="#D8B08A" font-size="7">
          <text x="14" y="44">국어</text><text x="30" y="44">수학</text><text x="48" y="44">영어</text>
          <text x="14" y="62">과학</text><text x="30" y="62">음악</text><text x="48" y="62">미술</text>
        </g>
      </g>

      <!-- 창문 -->
      <g id="window" transform="translate(662,132)">
        <rect x="0" y="0" width="138" height="176" rx="6" fill="#F6EFE0" stroke="#D8C39C" stroke-width="3" filter="url(#soft2)"/>
        <rect x="8" y="8" width="122" height="160" rx="3" fill="url(#gWin)"/>
        <g stroke="#FFFFFF" stroke-width="6" opacity=".95">
          <line x1="8" y1="88" x2="130" y2="88"/><line x1="69" y1="8" x2="69" y2="168"/>
        </g>
        <g fill="#FFFFFF" opacity=".5">
          <path d="M18,140 q34,-26 68,-6 q-30,22 -68,6z"/>
        </g>
        <rect x="-8" y="168" width="154" height="12" rx="4" fill="#F6EFE0" stroke="#D8C39C" stroke-width="2"/>
      </g>

      <!-- 꽃병 -->
      <g id="vase" transform="translate(636,300)">
        <path d="M0,0 q16,4 16,20 l-4,30 q0,10 -14,10 q-14,0 -14,-10 l-4,-30 q0,-16 16,-20z" fill="#BEE7F5" stroke="#8ECFE6" stroke-width="2"/>
        <g stroke="#6FBFA0" stroke-width="3" fill="none">
          <path d="M0,6 q-14,-34 -26,-46"/><path d="M0,6 q10,-38 22,-52"/><path d="M0,6 q2,-30 -2,-54"/>
        </g>
        <g>
          <circle cx="-28" cy="-44" r="9" fill="#FFA8C8"/><circle cx="-28" cy="-44" r="4" fill="#FFE07A"/>
          <circle cx="22" cy="-50" r="9" fill="#FFC0D8"/><circle cx="22" cy="-50" r="4" fill="#FFE07A"/>
          <circle cx="-2" cy="-56" r="8" fill="#FFB3CF"/><circle cx="-2" cy="-56" r="3.5" fill="#FFE07A"/>
          <circle cx="-16" cy="-62" r="6" fill="#FFD3E4"/><circle cx="12" cy="-66" r="6" fill="#FFD3E4"/>
        </g>
      </g>

      <!-- 맛동산 찬장 (좌상단) -->
      <g id="shelf" transform="translate(2,0)">
        <rect x="0" y="-6" width="176" height="88" rx="12" fill="url(#gWood)" stroke="#74471C" stroke-width="4" filter="url(#soft)"/>
        <rect x="8" y="2" width="160" height="72" rx="8" fill="#6B4118" opacity=".55"/>
        <!-- cookies pile -->
        <g id="shelfPile">
          <g fill="#E5A24A" stroke="#A9701F" stroke-width="1.5">
            <ellipse cx="34" cy="62" rx="17" ry="12"/>
            <ellipse cx="60" cy="60" rx="17" ry="12"/>
            <ellipse cx="46" cy="46" rx="17" ry="12"/>
            <ellipse cx="72" cy="44" rx="16" ry="11"/>
            <ellipse cx="34" cy="30" rx="16" ry="11"/>
            <ellipse cx="58" cy="28" rx="17" ry="12"/>
            <ellipse cx="44" cy="14" rx="15" ry="10"/>
          </g>
          <g fill="#B67A22" opacity=".75">
            <circle cx="30" cy="60" r="2"/><circle cx="40" cy="64" r="2"/><circle cx="56" cy="58" r="2"/>
            <circle cx="66" cy="62" r="2"/><circle cx="42" cy="44" r="2"/><circle cx="52" cy="48" r="2"/>
            <circle cx="70" cy="42" r="2"/><circle cx="30" cy="28" r="2"/><circle cx="54" cy="26" r="2"/>
            <circle cx="62" cy="30" r="2"/><circle cx="42" cy="12" r="2"/>
          </g>
        </g>
        <!-- count badge -->
        <g transform="translate(98,14)">
          <rect x="0" y="0" width="70" height="58" rx="12" fill="#FFF7E0" stroke="#A9701F" stroke-width="3"/>
          <text id="hudSnack" x="35" y="32" text-anchor="middle" font-size="30" font-weight="900" fill="#8A4E0E">15</text>
          <text x="35" y="49" text-anchor="middle" font-size="13" font-weight="800" fill="#B07A2E">남은 과자</text>
        </g>
      </g>

      <!-- ================= TEACHER ================= -->
      <!-- back view -->
      <g id="teacherBack" transform="translate(368,300) scale(0.86) translate(-368,-300)">
        <ellipse cx="368" cy="356" rx="98" ry="64" fill="#7FB3D5"/>
        <path d="M292,320 q76,-30 152,0 l0,66 q-76,22 -152,0z" fill="#79ACCE"/>
        <path d="M318,300 q50,24 100,0 q-4,28 -50,32 q-46,-4 -50,-32z" fill="#FFD766"/>
        <path d="M312,398 q58,-14 116,0 l12,66 q-70,14 -140,0z" fill="#6396BA"/>
        <path d="M318,300 q50,24 100,0 q-3,12 -50,14 q-47,-2 -50,-14z" fill="#F5C13D"/>
        <rect x="350" y="274" width="36" height="26" rx="10" fill="#F7CBA6"/>
        <ellipse cx="368" cy="240" rx="74" ry="66" fill="#8C4A20"/>
        <ellipse cx="368" cy="234" rx="66" ry="58" fill="#A05A2C"/>
        <circle cx="368" cy="166" r="37" fill="#8C4A20"/>
        <circle cx="368" cy="166" r="31" fill="#A05A2C"/>
        <path d="M352,150 q26,-6 32,18" stroke="#7C3F19" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle cx="368" cy="198" r="9" fill="#E0577C"/>
        <!-- left arm up holding pointer -->
        <path d="M298,330 q-34,-6 -52,-36" stroke="#79ACCE" stroke-width="26" stroke-linecap="round" fill="none"/>
        <circle cx="244" cy="292" r="15" fill="#F7CBA6"/>
        <line x1="240" y1="286" x2="192" y2="196" stroke="#B0763D" stroke-width="9" stroke-linecap="round"/>
        <!-- right arm -->
        <path d="M438,332 q30,10 44,40" stroke="#79ACCE" stroke-width="24" stroke-linecap="round" fill="none"/>
      </g>

      <!-- front view (turned around) -->
      <g id="teacherFront" opacity="0" transform="translate(368,300) scale(0.86) translate(-368,-300)">
        <ellipse cx="368" cy="356" rx="98" ry="64" fill="#7FB3D5"/>
        <path d="M292,320 q76,-30 152,0 l0,66 q-76,22 -152,0z" fill="#79ACCE"/>
        <path d="M318,300 q50,26 100,0 q-2,30 -50,34 q-48,-4 -50,-34z" fill="#FFD766"/>
        <path d="M312,398 q58,-14 116,0 l12,66 q-70,14 -140,0z" fill="#6396BA"/>
        <ellipse cx="368" cy="240" rx="76" ry="70" fill="#8C4A20"/>
        <ellipse cx="368" cy="254" rx="60" ry="56" fill="url(#gSkin)"/>
        <!-- fringe -->
        <path d="M308,246 q2,-46 60,-46 q58,0 60,46 q-14,-14 -34,-18 q-26,-6 -52,0 q-20,4 -34,18z" fill="#A05A2C"/>
        <path d="M310,240 q8,-28 28,-36 q-8,22 2,32z" fill="#8C4A20"/>
        <path d="M426,240 q-8,-28 -28,-36 q8,22 -2,32z" fill="#8C4A20"/>
        <circle cx="368" cy="168" r="35" fill="#8C4A20"/>
        <circle cx="368" cy="168" r="29" fill="#A05A2C"/>
        <path d="M354,152 q24,-4 30,16" stroke="#7C3F19" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="368" cy="197" r="8" fill="#E0577C"/>
        <!-- angry brows -->
        <g stroke="#7C3F19" stroke-width="4.5" stroke-linecap="round">
          <line x1="322" y1="238" x2="350" y2="246"/>
          <line x1="414" y1="238" x2="386" y2="246"/>
        </g>
        <!-- heart glasses -->
        <g fill="#FF5C9E" fill-opacity=".92" stroke="#D93C7E" stroke-width="4.5">
          <path d="M339,240 c-15,-15 -37,-4 -26,15 c7,13 26,24 26,24 c0,0 19,-11 26,-24 c11,-19 -11,-30 -26,-15z"/>
          <path d="M397,240 c-15,-15 -37,-4 -26,15 c7,13 26,24 26,24 c0,0 19,-11 26,-24 c11,-19 -11,-30 -26,-15z"/>
        </g>
        <!-- eyes through the glasses -->
        <g>
          <ellipse cx="339" cy="254" rx="11" ry="12" fill="#FFFFFF"/>
          <ellipse cx="340" cy="255" rx="6" ry="7" fill="#3E2A18"/>
          <circle cx="338" cy="252" r="2.4" fill="#FFFFFF"/>
          <ellipse cx="397" cy="254" rx="11" ry="12" fill="#FFFFFF"/>
          <ellipse cx="396" cy="255" rx="6" ry="7" fill="#3E2A18"/>
          <circle cx="394" cy="252" r="2.4" fill="#FFFFFF"/>
        </g>
        <g stroke="#D93C7E" stroke-width="4.5" fill="none">
          <line x1="361" y1="252" x2="375" y2="252"/>
